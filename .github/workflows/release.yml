name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :version" source/info.plist)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build
        run: ./scripts/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/Agent-Launcher.alfredworkflow
          dist/Agent-Launcher.alfredworkflow.sha256
          --generate-notes
