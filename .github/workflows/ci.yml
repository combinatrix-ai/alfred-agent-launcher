name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./scripts/test.sh
      - name: Build
        run: ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Launcher
          path: |
            dist/Agent-Launcher.alfredworkflow
            dist/Agent-Launcher.alfredworkflow.sha256
