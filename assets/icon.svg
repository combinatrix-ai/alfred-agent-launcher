<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Combinatrix.ai GitHub avatar, optically centered</title>
  <desc id="desc">Three interlocking double C forms arranged with threefold symmetry and nudged downward for optical centering.</desc>
  <defs>
    <linearGradient id="mark-gradient" x1="190" y1="193" x2="850" y2="923" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7E98BC"/>
      <stop offset="1" stop-color="#4F786E"/>
    </linearGradient>
    <g id="c-module" fill="none" stroke="url(#mark-gradient)" stroke-width="52" stroke-linecap="round">
      <circle cx="512" cy="340" r="80" stroke-dasharray="266 237" transform="rotate(175 512 340)"/>
      <circle cx="512" cy="340" r="160" stroke-dasharray="533 473" transform="rotate(175 512 340)"/>
    </g>
  </defs>

  <rect width="1024" height="1024" fill="#EEF3F1"/>
  <g transform="translate(0 43)">
    <use href="#c-module"/>
    <use href="#c-module" transform="rotate(120 512 512)"/>
    <use href="#c-module" transform="rotate(240 512 512)"/>
  </g>
</svg>
